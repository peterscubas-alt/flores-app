<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070809">
  <meta name="description" content="Escribe un nombre y deja que florezca. Ramos dibujados con flores diferentes, hechos para compartir.">
  <title>Flor de Letras — Estudio floral</title>
<style>
  :root { color-scheme:dark; --bg:#070809; --panel:#17191c; --key:#222326; --ink:#f7f5f5; --muted:#949397; --rose:#f4a5c7; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  button,input,textarea { font:inherit; } button { color:inherit; cursor:pointer; touch-action:manipulation; }
  button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--rose); outline-offset:3px; }
  .app { width:100%; max-width:540px; margin:0 auto; height:100dvh; min-height:615px; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); background:#070809; position:relative; isolation:isolate; }
  .topbar { flex:0 0 55px; height:55px; display:flex; align-items:center; justify-content:space-between; padding:0 4px; gap:10px; }
  .brand { display:flex; gap:10px; align-items:center; white-space:nowrap; }
  .brand-icon { width:30px; height:30px; display:grid; place-items:center; background:#1d1b1d; border:1px solid #393037; border-radius:11px; }
  .brand-icon svg { width:20px; height:20px; }
  .brand-name { font-family:Georgia,"Times New Roman",serif; font-size:24px; letter-spacing:-1px; font-weight:600; line-height:1; }
  .brand-name em { color:#e9a4bb; font-style:normal; }
  .brand-small { display:block; font-size:9px; letter-spacing:2.6px; text-transform:uppercase; color:#8a858a; font-weight:650; margin-top:4px; }
  .icon-button { display:inline-flex; align-items:center; justify-content:center; border:1px solid #303135; width:36px; height:36px; border-radius:12px; background:#17181a; transition:background .2s; }
  .icon-button:hover,.control:hover,.key:hover { background:#333036; }
  .icon-button svg { width:18px; height:18px; }
  .top-right {display:flex; gap:8px; align-items:center;}
  .stage { flex:1 1 auto; min-height:275px; position:relative; overflow:hidden; background:radial-gradient(ellipse at 50% 69%, #101411 0%, #090b0a 38%, #070809 77%); border-radius:17px; }
  .stage:before { content:""; position:absolute; inset:0; pointer-events:none; z-index:2; border-radius:inherit; box-shadow:inset 0 -18px 45px rgba(7,8,9,.2); }
  .bouquet-svg { display:block; width:100%; height:100%; overflow:visible; }
  .caption { position:absolute; z-index:3; top:5.2%; left:5.6%; right:5%; font-size:clamp(16px, 4.3vw, 23px); font-weight:740; line-height:1.32; white-space:pre-line; letter-spacing:-.45px; text-shadow:0 1px 4px #060606; pointer-events:none; }
  .stage-empty { position:absolute; z-index:2; bottom:23%; left:0; right:0; text-align:center; opacity:.55; font-size:12px; pointer-events:none; }
  .empty-hint svg { width:30px; height:30px; display:block; margin:0 auto 8px; }
  .stage-label { position:absolute; z-index:3; bottom:11px; left:14px; font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:#aaa4a5; background:rgba(12,13,14,.67); backdrop-filter:blur(8px); border-radius:99px; padding:6px 10px; pointer-events:none; }
  .stage-label strong { color:#eee8e7; font-weight:650; }
  .keyboard-section { flex:0 0 auto; padding-top:7px; }
  .keyboard-title { height:22px; display:flex; justify-content:space-between; align-items:flex-start; padding:0 4px; color:#8e8c90; font-size:10px; letter-spacing:1px; text-transform:uppercase; }
  .keyboard-title span:last-child { color:#bd9cad; font-size:10px; letter-spacing:0; text-transform:none; }
  .keys { display:flex; flex-direction:column; gap:5px; }
  .key-row { display:grid; gap:4px; width:100%; margin:0 auto; }
  .key-row.one { grid-template-columns:repeat(10,minmax(0,1fr)); }
  .key-row.two { width:92%; grid-template-columns:repeat(9,minmax(0,1fr)); }
  .key-row.three { grid-template-columns:repeat(7,minmax(0,1fr)) 1.26fr 1.24fr; }
  .key { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:space-between; min-width:0; height:clamp(63px,9.6dvh,86px); border:1px solid #343437; background:linear-gradient(152deg,#252528,#1c1d20 82%); border-radius:7px; padding:2px 0 4px; box-shadow:0 2px 0 rgba(0,0,0,.35); transition:transform .13s, background .16s, border-color .16s; user-select:none; }
  .key:active { transform:translateY(2px) scale(.96); border-color:#b97699; background:#382a33; }
  .key .preview { display:block; width:100%; height:calc(100% - 18px); min-height:38px; overflow:visible; }
  .key .letter { display:block; font-family:Georgia,serif; font-weight:500; font-size:clamp(14px,3.5vw,19px); line-height:17px; color:#f5f1ee; }
  .key .count { display:block; position:absolute; top:3px; right:3px; font-size:8px; font-family:system-ui,sans-serif; color:#aaa1a2; line-height:1; }
  .key.special { justify-content:center; background:#454349; border-color:#555158; padding:4px 1px; }
  .key.special svg { width:23px; height:23px; }
  .key.special.ok { background:#f0b3cb; border-color:#f0b3cb; color:#20151d; font-size:16px; font-weight:800; letter-spacing:.3px; }
  .controls { flex:0 0 52px; min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 1px 4px; }
  .control { display:flex; align-items:center; justify-content:center; gap:5px; min-width:0; white-space:nowrap; flex:1; border:1px solid #292b2d; border-radius:10px; color:#d4d0d1; background:#161719; min-height:37px; font-size:11px; font-weight:600; padding:5px 3px; }
  .control svg { flex:0 0 auto; width:14px; height:14px; }
  .control.primary { background:#ead0dc; color:#241920; border-color:#ead0dc; }
  .bottom-note { min-height:18px; flex:0 0 18px; font-size:10px; text-align:center; color:#77767a; letter-spacing:.15px; }
  body.cinema .topbar,body.cinema .controls,body.cinema .bottom-note,body.cinema .keyboard-title { display:none; }
  body.cinema .app { padding-top:env(safe-area-inset-top); }
  body.cinema .stage { border-radius:0; }
  body.cinema .stage-label { display:none; }
  body.cinema .exit-cinema { opacity:.25; }
  body.cinema .keyboard-section { padding-top:2px; }
  .exit-cinema { display:none; position:absolute; top:10px; right:10px; z-index:10; border:1px solid #7c6572; border-radius:100px; background:#221b20db; color:#f2dce5; padding:7px 11px; font-size:11px; }
  body.cinema .exit-cinema { display:block; }
  .toast { position:absolute; bottom:300px; left:50%; transform:translateX(-50%); z-index:15; padding:10px 15px; border-radius:100px; background:#e4cbdb; color:#261720; font-size:12px; font-weight:650; white-space:nowrap; box-shadow:0 8px 30px #0009; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.68); z-index:20; justify-content:center; align-items:flex-end; padding:0 10px; }
  .overlay.show { display:flex; }
  .sheet { width:100%; max-width:520px; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); background:#1a1b1e; border-radius:22px 22px 0 0; border:1px solid #3a383b; box-shadow:0 -12px 50px #0009; animation:slideUp .25s ease both; max-height:90dvh; overflow:auto; }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-head h2 { margin:0; font-family:Georgia,serif; font-size:25px; font-weight:500; }
  .sheet-head button { border:0; background:#343338; border-radius:100px; width:29px; height:29px; font-size:20px; }
  .field { display:block; margin:0 0 18px; }
  .field label { display:flex; justify-content:space-between; font-size:12px; font-weight:650; color:#ddd3d8; margin-bottom:8px; }
  .field label span { color:#eaaac7; }
  .field textarea,.field input[type=text] { width:100%; border:1px solid #4b4449; border-radius:12px; background:#0e0f11; color:#fdf6f8; padding:12px; resize:vertical; outline:0; }
  .field textarea { min-height:100px; line-height:1.45; }
  .field input[type=range] { width:100%; accent-color:#e8a5c4; }
  .swatches { display:flex; gap:7px; flex-wrap:wrap; }
  .swatch { flex:1; min-width:65px; border:1px solid #444044; background:#262428; padding:8px 3px; border-radius:9px; font-size:11px; }
  .swatch.selected { border-color:#f1b2cb; background:#4c303e; }
  .sheet-save { width:100%; border:0; background:#eab5cc; color:#21161d; border-radius:12px; min-height:42px; font-weight:750; margin-top:3px; }
  .credit { margin-top:13px; font-size:11px; text-align:center; color:#8d858b; }
  .flower-arrive { animation:flowerAppear .6s cubic-bezier(.16,1.5,.42,1) both; transform-box:fill-box; transform-origin:50% 50%; }
  .stem-grow { stroke-dasharray:1; stroke-dashoffset:0; animation:stemAppear .65s ease-out both; }
  @keyframes flowerAppear { from { opacity:0; transform:scale(.08) rotate(-24deg); } to { opacity:1; transform:scale(1) rotate(0deg); } }
  @keyframes stemAppear { from { stroke-dashoffset:1; opacity:.3; } to { stroke-dashoffset:0; opacity:1; } }
  @keyframes slideUp { from {transform:translateY(30px); opacity:.6;} to {transform:translateY(0); opacity:1;} }
  @media(min-width:650px) { body {background:radial-gradient(ellipse at 50% 40%,#222025,#0b0b0d 65%)} .app { box-shadow:0 0 60px #0008; border-left:1px solid #222326; border-right:1px solid #222326; } .caption {font-size:22px} }
  @media(max-height:730px) { .topbar {flex-basis:46px;height:46px} .brand-small {display:none} .key {height:62px} .controls {flex-basis:43px;min-height:43px} .bottom-note {display:none} .caption {top:3.5%; font-size:clamp(15px,4.1vw,19px)} }
  @media(max-width:370px) { .app {padding-left:7px; padding-right:7px} .key-row {gap:3px} .key {height:67px;border-radius:5px} .controls {gap:4px} .control {font-size:10px} .control svg {width:12px;height:12px} }
  @media(prefers-reduced-motion:reduce) { *, *:before,*:after { animation-duration:.01ms !important; transition:none !important; } }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20v-8M12 12C8 7 5 7 4.5 9.5 4 12 9 14 12 12ZM12 12C11 7 13 3 15.7 4.3 18.2 5.5 16 10 12 12Z" fill="none" stroke="#edb1c8" stroke-width="1.8" stroke-linecap="round"/><path d="M11.8 17c-3-4-5-3-6-2 1 2 3.2 3 6 2Z" fill="#93b789"/></svg></div>
      <div><div class="brand-name">flor<em>.</em></div><span class="brand-small"></span></div>
    </div>
    <div class="top-right">
      <button class="icon-button" id="editBtn" aria-label="Personalizar texto y flores" title="Personalizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 16-.7 4.7L8 20l11.5-11.5a2.5 2.5 0 0 0-3.5-3.5L4 16Z"/><path d="m14.5 6.5 3 3"/></svg>
      </button>
      <button class="icon-button" id="downloadBtn" aria-label="Guardar imagen PNG" title="Guardar imagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>
      </button>
    </div>
  </header>
  <section class="stage" id="stage" aria-label="Ramo de flores personalizado">
    <div class="caption" id="caption">él: «¿qué estará haciendo?»
yo haciendo un ramo
con su nombre 💗</div>
    <svg class="bouquet-svg" id="bouquet" viewBox="0 0 440 500" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ramo con diferentes flores"></svg>
    <div class="stage-empty" id="emptyHint" hidden><div class="empty-hint"><svg viewBox="0 0 24 24" fill="none" stroke="#efb6ce" stroke-width="1.3"><path d="M12 22V10M12 12C8 7 5 5 3 7c-2 3 2 6 9 5M12 12c6-2 8-6 5-8-4-2-7 4-5 8"/><path d="m12 18-5-3"/></svg></div></div>
    <div class="stage-label" id="stageLabel"><strong>AMOR</strong> · 32 flores</div>
    <button id="exitCinema" class="exit-cinema" type="button" aria-label="Salir de modo TikTok">✕ Salir</button>
  </section>
  <section class="keyboard-section" aria-label="Teclado de flores">
    <div class="keyboard-title"><span>Elige las flores de cada letra</span><span id="keyboardCount"></span></div>
    <div class="keys" id="keys"></div>
  </section>
  <nav class="controls" aria-label="Acciones del ramo">
    <button class="control" id="clearBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg>Nuevo</button>
    <button class="control" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14 4 9l5-5M4 9h9a6 6 0 0 1 0 12"/></svg>Borrar</button>
    <button class="control" id="replayBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 6 9 6-9 6V6Z"/></svg>Repetir</button>
    <button class="control primary" id="cinemaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>TikTok</button>
  </nav>
  <div class="bottom-note"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</main>
<div class="overlay" id="overlay" role="presentation">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-head"><h2 id="settingsTitle">Tu jardín, tus reglas</h2><button id="closeSheet" aria-label="Cerrar">×</button></div>
    <div class="field"><label for="phrase">Texto del TikTok</label><textarea id="phrase" spellcheck="false">él: «¿qué estará haciendo?»
yo haciendo un ramo
con su nombre 💗</textarea></div>
    <div class="field"><label for="wordInput">Nombre para el ramo</label><input id="wordInput" type="text" maxlength="18" placeholder="Ejemplo: AMOR" autocomplete="off" autocapitalize="characters"></div>
    <div class="field"><label for="density">Flores por letra <span id="densityDisplay">7–11</span></label><input type="range" id="density" min="6" max="12" step="1" value="9"></div>
    <div class="field"><label>Paleta de colores</label><div class="swatches" id="swatches"><button class="swatch selected" data-palette="original">🌈 Natural</button><button class="swatch" data-palette="pastel">🌸 Pastel</button><button class="swatch" data-palette="pink">💗 Rosas</button><button class="swatch" data-palette="blue">💙 Azules</button></div></div>
    <button class="sheet-save" id="saveSettings">Aplicar cambios</button>
    <div class="credit">Cada tecla refleja sus flores · Sin imágenes externas ni conexión</div>
  </section>
</div>
<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  const SPECIES = {
    Q:['baby','#f5efe8'], W:['goldenrod','#f4bf46'], E:['lavender','#b995ee'], R:['rose','#e86693'], T:['daisy','#fff6db'],
    Y:['lily','#f39ab9'], U:['hydrangea','#7cb8f5'], I:['cosmos','#e99fcd'], O:['sunflower','#f7c63f'], P:['tulip','#ee718c'],
    A:['cherry','#f5b3ce'], S:['forget','#6aa8fb'], D:['buttercup','#f4d349'], F:['yarrow','#f6f1db'], G:['anemone','#a889ea'],
    H:['poppy','#f58c5b'], J:['carnation','#f49eba'], K:['chamomile','#fff5d7'], L:['iris','#b691eb'],
    Z:['orchid','#f5dedc'], X:['peony','#ef95af'], C:['violet','#a18aeb'], V:['bell','#ec7c9a'], B:['delphinium','#5c9ae9'],
    N:['marigold','#f0ba37'], M:['dahlia','#eea36e']
  };
  const layout = [
    [222,305],[148,276],[299,268],[105,226],[343,217],[218,195],[157,180],[294,176],[86,297],[359,296],
    [226,154],[114,173],[341,166],[181,240],[271,236],[64,241],[385,240],[220,224]
  ];
  const offsets=[[-35,-12],[14,-43],[38,10],[-18,30],[10,-8],[-46,12],[40,-29],[-3,37],[-6,-52],[27,34],[-39,-38]];
  // A golden-angle arrangement spreads each letter across the bouquet. Existing flowers
  // keep their position as new letters arrive, so replay never jumps or rearranges petals.
  function blossomSlot(k) {
    const angle = k*2.399963229728653 + .42;
    const radius = 12 + 21.7*Math.sqrt(k+1);
    const jitter=(rnd(k*37+10)-.5)*12;
    const x=clamp(220+Math.cos(angle)*(radius+jitter)*1.18,40,400);
    // A domed, asymmetric silhouette rather than a circular wreath.
    const sides=Math.pow(Math.abs(x-220)/180,1.6)*23;
    const y=clamp(260+Math.sin(angle)*(radius+jitter)*.70+sides+(rnd(k*31+12)-.5)*24,166,372);
    return {x,y};
  }
  let entries=['A','M','O','R'], density=9, palette='original', playing=false, replayToken=0, customText=$('phrase').value;

  const rnd = n => { const x=Math.sin(n*127.1027+13.382)*43758.545312; return x-Math.floor(x); };
  const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
  const num=n => Math.round(n*1000)/1000;
  function node(tag,props={},parent=null){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(props)) if(v!==undefined && v!==null) el.setAttribute(k,String(v));if(parent)parent.appendChild(el);return el;}
  function group(p,props){return node('g',props,p);}
  function path(p,d,fill='none',stroke='none',sw=1){return node('path',{d,fill,stroke,'stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round'},p);}
  function ellipse(p,x,y,rx,ry,fill,rotate=0,stroke='none',sw=.015){return node('ellipse',{cx:num(x),cy:num(y),rx:num(rx),ry:num(ry),fill,stroke,'stroke-width':sw,transform:rotate?`rotate(${num(rotate)} ${num(x)} ${num(y)})`:undefined},p);}
  function circle(p,x,y,r,fill,stroke='none',sw=.02){return node('circle',{cx:num(x),cy:num(y),r:num(r),fill,stroke,'stroke-width':sw},p);}
  const hexToRGB=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  function rgbToHex(a){return '#'+a.map(n=>clamp(Math.round(n),0,255).toString(16).padStart(2,'0')).join('');}
  function mix(a,b,t){const A=hexToRGB(a),B=hexToRGB(b);return rgbToHex(A.map((v,i)=>v*(1-t)+B[i]*t));}
  function tint(color,kind){return palette==='original'?color:mix(color,({pink:'#f7a0c7',blue:'#7aaff5',pastel:'#f5e4f0'}[palette]||color),palette==='pastel'?.28:.73);}
  function flowerCount(letter){return clamp(density + Math.floor(rnd(letter.charCodeAt(0)*2.7)*5)-2,4,14);}
  function flowerInfo(l){const [type,color]=SPECIES[l];return {type,color:tint(color),count:flowerCount(l)};}
  function radial(g,n,col,variant='round',dark=null,seed=0){
    const outer=variant==='slim'?1.22:variant==='sharp'?1.12:1.03;
    for(let k=0;k<n;k++){
      const q=group(g,{transform:`rotate(${360*k/n + (rnd(seed+k)-.5)*3})`});
      const c=mix(col, k%4===0?'#ffffff':'#6f2845',k%4===0?.09:.075);
      if(variant==='slim') path(q,`M 0 -.06 Q -.23 -.53 -.175 -.9 Q -.15 -1.34 0 -1.32 Q .2 -1.32 .18 -.9 Q .25 -.51 0 -.06 Z`,c,mix(c,'#866d7a',.11),.016);
      else if(variant==='sharp') path(q,`M 0 -.07 Q -.38 -.51 -.25 -.86 L 0 -${outer} L .25 -.86 Q .38 -.51 0 -.07 Z`,c,mix(c,'#8a4963',.16),.018);
      else path(q,`M 0 -.07 C -.43 -.42 -.6 -.75 -.35 -.94 C -.14 -1.1 .12 -1.09 .33 -.94 C .61 -.69 .44 -.41 0 -.07 Z`,c,mix(c,'#ac6a88',.14),.016);
      path(q,`M 0 -.15 Q -.07 -.55 0 -${variant==='slim'?1.16:.9}`,'none',mix(c,'#ffffff',.36),.018);
    }
  }
  function tinyStar(p,x,y,r,color,n=5){const g=group(p,{transform:`translate(${num(x)} ${num(y)}) scale(${num(r)})`});radial(g,n,color,'round');circle(g,0,0,.2,'#ecc85c');return g;}
  function drawHead(parent,type,color,x,y,size,seed=10,preview=false){
    const wrap=group(parent,{transform:`translate(${num(x)} ${num(y)}) rotate(${num((rnd(seed)-.5)*(type==='tulip'?14:26))}) scale(${num(size)})`});
    const bloom=group(wrap,{class:preview?'':'bloom-core'});
    const dk=mix(color,'#9d4062',.22),light=mix(color,'#ffffff',.4);

      let s= [29,18,14,24,12,33,20,16,25,13,22,19,15,26][j%14] * (.90 + rnd(seed+j*7)*.20);

  function render(animateIndex=-1){
    const svg=$('bouquet');svg.replaceChildren();createDefs(svg);
    const stemLayer=group(svg),leafLayer=group(svg),flowerLayer=group(svg);
    let blooms=[],position=0;
    const plans=entries.map((l,i)=>{const out=branchPlan(l,i,position);position+=out.blooms.length;return out;});
    plans.forEach((plan,i)=>drawBranchStems(stemLayer,leafLayer,plan,i,i===animateIndex,plans.length));
    plans.forEach((plan,i)=>plan.blooms.forEach((b,j)=>blooms.push({...b,index:i,order:j})));

    blooms.sort((a,b)=>a.y-b.y);
    // Avoid a screenful of tiny flowers when the word is unusually long.
    const factor=blooms.length>95?.76:blooms.length>70?.87:1;
    blooms.forEach(b=>{
      const c=group(flowerLayer);
      drawHead(c,b.kind,b.color,b.x,b.y,b.size*factor,b.seed);

    });

    if(entries.length){
      for(let k=0;k<11;k++){
        const a=k*2.399,rad=32+8*Math.sqrt(k+1);
        const x=220+Math.cos(a)*rad, y=414+Math.sin(a)*34+(rnd(k+233)-.5)*18;

    if (

  }

      source.querySelectorAll('.flower-arrive,.stem-grow').forEach(el=>el.removeAttribute('class'));
      const serial=new XMLSerializer().serializeToString(source);
      const blob=new Blob([serial],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);
      const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
      ctx.drawImage(img,0,445,1080,1228);URL.revokeObjectURL(url);
      ctx.fillStyle='#d9c4cd';ctx.font='30px -apple-system, Arial, sans-serif';ctx.textAlign='center';ctx.fillText((entries.join('')||'TU RAMO')+'  ♡',540,1748);ctx.textAlign='start';
      const data=canvas.toDataURL('image/png');const link=document.createElement('a');link.href=data;link.download=`ramo-${entries.join('').toLowerCase()||'flores'}.png`;document.body.append(link);link.click();link.remove();toast('Imagen PNG guardada 💐');
    }catch(err){console.error(err);toast('No se pudo exportar. Usa captura de pantalla.');}
  }
  $('editBtn').onclick=openSheet;
  $('closeSheet').onclick=closeSheet;
  $('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet();});
  $('saveSettings').onclick=applySettings;
  $('density').oninput=e=>$('densityDisplay').textContent=`${e.target.value-2}–${+e.target.value+2}`;
  $('swatches').addEventListener('click',e=>{const el=e.target.closest('[data-palette]');if(!el)return;palette=el.dataset.palette;updateSwatches();});
  $('clearBtn').onclick=clear;$('undoBtn').onclick=undo;$('replayBtn').onclick=()=>replay(false);$('cinemaBtn').onclick=()=>replay(true);
  $('exitCinema').onclick=stopCinema;$('downloadBtn').onclick=downloadPNG;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeSheet();if(document.body.classList.contains('cinema'))stopCinema();return;}
    if($('overlay').classList.contains('show'))return;
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
    if(e.key==='Backspace'){e.preventDefault();undo();return;}
    if(/^[a-zA-Z]$/.test(e.key)){e.preventDefault();add(e.key.toUpperCase());}
  });
  buildKeyboard();render();
})();
</script>
</body>
</html>
